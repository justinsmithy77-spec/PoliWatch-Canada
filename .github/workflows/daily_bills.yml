name: Daily Bill Updater

on:
  schedule:
    # Runs every morning at 6:00 AM Mountain Time (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required packages
        run: pip install requests beautifulsoup4

      - name: Fetch latest Canadian bills
        run: python scripts/update_bills.py

      - name: Save updated bills to repository
        run: |
          git config user.name "PoliWatch Bot"
          git config user.email "bot@poliwatchcanada.ca"
          git add data/all_bills.json
          git diff --staged --quiet || git commit -m "Auto-update daily Canadian bills"
          git push
