    function buildGoogleNewsSearchUrl(query) {
      return `https://news.google.com/search?q=${encodeURIComponent(query)}&hl=en-CA&gl=CA&ceid=CA:en`;
    }

    function buildXHashtagUrl(tag) {
      return `https://x.com/search?q=${encodeURIComponent(tag)}&f=live`;
    }

    function daysUntil(dateStr, now) {
      const target = new Date(`${dateStr}T12:00:00`);
      const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
      return diff > 0 ? `${diff} days away` : 'Active / Imminent';
    }

    function getStatus(j, now) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: j.timeZone,
        weekday: 'short',
        hour: 'numeric',
        minute: 'numeric',
        hour12: false,
      }).formatToParts(now);
      const map = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
      const day = map[parts.find((p) => p.type === 'weekday')?.value || 'Mon'] ?? 1;
      const h = parseInt(parts.find((p) => p.type === 'hour')?.value || '12', 10);
      const m = parseInt(parts.find((p) => p.type === 'minute')?.value || '0', 10);
      const dec = h + m / 60;
      const localTime = new Intl.DateTimeFormat('en-CA', {
        timeZone: j.timeZone,
        hour: 'numeric',
        minute: '2-digit',
        hour12: true,
      }).format(now);

      const isSittingDay = j.sittingDays.includes(day);
      const isLive = isSittingDay && dec >= j.startHourLocal && dec <= j.endHourLocal;
      return {
        isLive,
        localTime,
        label: isLive ? 'LIVE IN SESSION' : isSittingDay ? 'Scheduled Sitting Day' : 'Not Sitting Today',
      };
    }

      async function handlePostalLookup(e) {
        e.preventDefault();
        const cleaned = postalCode.replace(/\s+/g, '').toUpperCase();
        if (cleaned.length !== 6) {
          setRepError('Please enter a valid 6-character Canadian postal code (e.g., V9B 2W7).');
          return;
        }
        setRepLoading(true);
        setRepError('');
        setRepResults([]);
        setLookupMeta(null);

        const provCodes = FSA_TO_PROVINCE[cleaned[0]] || [];

        try {
          const res = await fetch(`https://represent.opennorth.ca/postcodes/${cleaned}/`);
          if (!res.ok) throw new Error('Postal code not found');
          const data = await res.json();

          const centroidReps = data.representatives_centroid || [];
          const concordanceReps = data.representatives_concordance || [];

          const isFedOrProv = (office) =>
            ['MP', 'MLA', 'MPP', 'MNA', 'MHA'].includes((office || '').toUpperCase());

          const finalReps = [];
          const seenRoles = new Set();
          const seenPeople = new Set();

          for (const r of [...centroidReps, ...concordanceReps]) {
            const office = (r.elected_office || '').toUpperCase();
            if (!isFedOrProv(office)) continue;
            if (seenRoles.has(office) || seenPeople.has(r.name)) continue;
            seenRoles.add(office);
            seenPeople.add(r.name);
            finalReps.push({
              ...r,
              isMunicipal: false,
              level: office === 'MP' ? 'Federal (House of Commons)' : 'Provincial / Territorial',
            });
          }

          let hasMayor = false;
          for (const r of centroidReps) {
            const office = (r.elected_office || '').trim();
            if (isFedOrProv(office) || seenPeople.has(r.name)) continue;
            if (office.toLowerCase() === 'mayor') {
              if (hasMayor) continue;
              hasMayor = true;
            }
            seenPeople.add(r.name);
            finalReps.push({
              ...r,
              isMunicipal: true,
              level: r.representative_set_name || 'Municipal Council',
            });
          }

          const hasFederalMP = finalReps.some(
            (r) => (r.elected_office || '').toUpperCase() === 'MP'
          );
          const hasProvincialRep = finalReps.some((r) =>
            ['MLA', 'MPP', 'MNA', 'MHA'].includes((r.elected_office || '').toUpperCase())
          );

          setRepResults(finalReps);
          setLookupMeta({
            postalCode: cleaned,
            hasFederalMP,
            hasProvincialRep,
            provCodes,

          setRepError('Could not retrieve riding info right now. Check the postal code and try again.');

                    }`}
                  >
                    {j.shortName}{count > 0 ? ` (${count})` : ''}
                  </button>
                );
              })}
            </div>
          </header>

          {/* TAB 1: LIVE MONITOR & BILLS */}
          {activeTab === 'monitor' && (
            <main className="max-w-7xl mx-auto px-4 py-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
              <section className="lg:col-span-7 space-y-5">
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Search active bills, provinces, or topics..."
                  className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500"
                />

                {filteredBills.length > 0 ? (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-semibold text-white">
                        Tracked Active Legislation ({filteredBills.length})
                      </h2>
                      <span className="text-[11px] text-slate-400">Updated Nov 20, 2026</span>
                    </div>
                    {filteredBills.map((bill) => {
                      const relatedNewsQuery = `"${bill.number}" "${bill.title}" Canada`;
                      return (
                        <div
                          key={bill.id}
                          onClick={() => setActiveBill(bill)}
                          className="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 cursor-pointer space-y-2.5"
                        >
                          <div className="flex items-center justify-between text-xs">
                            <span className="px-2 py-0.5 rounded bg-red-600/20 text-red-400 font-semibold">
                              {bill.jurisdictionName} • {bill.number}
                            </span>
                            <span className="text-emerald-400 font-semibold">{bill.stageLabel}</span>
                          </div>
                          <h3 className="text-base font-semibold text-white">{bill.title}</h3>
                          <p className="text-xs text-slate-300 bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                            <strong className="text-amber-400">Official Scope:</strong> {bill.background}
                          </p>

                          <div className="grid grid-cols-5 gap-1 pt-1">
                            {READING_STAGES.map((st) => (
                              <div key={st.step} className="space-y-1">
                                <div className={`h-1.5 rounded-full ${st.step <= bill.stageStep ? 'bg-emerald-500' : 'bg-slate-800'}`} />
                                <span className="text-[10px] text-slate-400 block truncate">{st.label}</span>
                              </div>
                            ))}
                          </div>

                          <div
                            className="pt-2 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2 text-xs"
                            onClick={(e) => e.stopPropagation()}
                          >
                            <span className="text-slate-400 truncate max-w-[60%]">{bill.latestActivity}</span>
                            <div className="flex items-center gap-2">
                              <a
                                href={buildGoogleNewsSearchUrl(relatedNewsQuery)}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="px-2.5 py-1 rounded-md bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/30 font-medium"
                              >
                                Related News Articles ↗
                              </a>
                              <a
                                href={bill.officialUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium"
                              >
                                Bill Text ↗
                              </a>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="bg-slate-900 border border-amber-500/30 rounded-xl p-5 space-y-2.5">
                    <div className="text-xs font-bold uppercase tracking-wider text-amber-400">
                      {activeJurObj ? `${activeJurObj.name} — Session Status` : 'No Matching Bills'}
                    </div>
                    <p className="text-sm text-slate-200">
                      {activeJurObj?.emptyBillsNote || 'No bills match your current search filter.'}
                    </p>
                    {activeJurObj && (
                      <div className="pt-1">
                        <a
                          href={activeJurObj.billsUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-xs font-semibold text-white"
                        >
                          Open Official {activeJurObj.shortName} Bills Portal ↗
                        </a>
                      </div>
                    )}
                  </div>
                )}

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-semibold text-white">
                        Public Interest & Political Headlines — {activeJurName}
                      </h2>
                      <p className="text-[11px] text-slate-400">
                        Live public-interest stories and legislative reporting
                      </p>
                    </div>
                    <a
                      href={buildGoogleNewsSearchUrl(`${activeJurName} legislature OR parliament OR bill`)}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-xs text-blue-400 hover:text-blue-300 font-medium"
                    >
                      More Coverage ↗
                    </a>
                  </div>

                  {loadingNews ? (
                    <p className="text-xs text-slate-400 py-2">Loading latest headlines...</p>
                  ) : newsItems.length > 0 ? (
                    <div className="divide-y divide-slate-800/80">
                      {newsItems.slice(0, 6).map((item, idx) => (
                        <a
                          key={idx}
                          href={item.link}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="block py-2.5 first:pt-1 last:pb-1 group"
                        >
                          <div className="text-xs sm:text-sm font-medium text-slate-200 group-hover:text-blue-300 transition leading-snug">
                            {item.title}
                          </div>
                          <div className="text-[11px] text-slate-500 mt-1">
                            CBC News • {new Date(item.pubDate).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}
                          </div>
                        </a>
                      ))}
                    </div>
                  ) : (
                    <div className="text-xs text-slate-400 bg-slate-950 p-3 rounded-lg border border-slate-800 flex items-center justify-between">
                      <span>Browse live {activeJurName} political & legislative news coverage:</span>
                      <a
                        href={buildGoogleNewsSearchUrl(`${activeJurName} politics legislation`)}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-3 py-1.5 rounded bg-blue-600/20 text-blue-300 border border-blue-500/30 font-medium shrink-0 ml-2"
                      >
                        Open News Feed ↗
                      </a>
                    </div>
                  )}
                </div>

                <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <h2 className="text-sm font-semibold text-white">
                      Official Active Bills & Order Papers by Legislature
                    </h2>
                    <span className="text-[11px] text-slate-400">Verified Portals</span>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    {filteredPortals.map((j) => (
                      <div
                        key={j.code}
                        className="p-3 rounded-lg bg-slate-950 border border-slate-800 flex flex-col justify-between gap-2"
                      >
                        <div>
                          <div className="text-xs font-semibold text-white">{j.name}</div>
                          <div className="text-[11px] text-slate-400">{j.sessionLabel}</div>
                        </div>
                        <div className="flex items-center gap-2 text-[11px] pt-1">
                          <a
                            href={j.billsUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-2.5 py-1 rounded bg-red-600/20 hover:bg-red-600/30 text-red-300 border border-red-500/30 font-medium"
                          >
                            Official Bills →
                          </a>
                          <a
                            href={buildGoogleNewsSearchUrl(`${j.shortName} legislature bills`)}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-2.5 py-1 rounded bg-blue-600/15 hover:bg-blue-600/25 text-blue-300 border border-blue-500/30 font-medium"
                          >
                            News Coverage ↗
                          </a>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              <aside className="lg:col-span-5 space-y-4">
                <div
                  onClick={() => setActiveTab('elections')}
                  className="bg-amber-500/10 hover:bg-amber-500/15 border border-amber-500/30 rounded-xl p-3.5 cursor-pointer transition flex items-center justify-between gap-3"
                >
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400">
                      Next Election Alert • Dec 7, 2026
                    </span>
                    <p className="text-xs font-semibold text-white mt-0.5">
                      6 Federal By-Elections Underway + Full Election Calendar
                    </p>
                  </div>
                  <span className="text-xs font-semibold text-amber-300 shrink-0">View →</span>
                </div>

                <div className="bg-slate-900 border border-blue-500/30 rounded-xl p-4 space-y-3">
                  <div>
                    <h2 className="text-sm font-bold text-white flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-blue-400 animate-pulse" />
                      24/7 Canadian Live News Broadcasts
                    </h2>
                    <p className="text-[11px] text-slate-400 mt-0.5">
                      Direct links to Canada’s live national & regional broadcast hubs
                    </p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {LIVE_NEWS_NETWORKS.map((net) => (
                      <a
                        key={net.name}
                        href={net.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="p-2.5 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-blue-500/40 transition block"
                      >
                        <div className="flex items-center justify-between gap-1">
                          <span className="text-xs font-semibold text-blue-300">{net.name} ↗</span>
                        </div>
                        <p className="text-[10px] text-slate-400 mt-0.5">{net.desc}</p>
                      </a>
                    ))}
                  </div>
                </div>

                <div className="space-y-2.5">
                  <h2 className="text-sm font-semibold text-white">Official Legislature Broadcasts & Schedules</h2>
                  {filteredPortals.map((j) => {
                    const isLive = j.status.isLive;
                    return (
                      <div key={j.code} className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2">
                        <div className="flex items-center justify-between">
                          <div>
                            <h3 className="text-sm font-semibold text-white">{j.name}</h3>
                            <p className={`text-[11px] ${isLive ? 'text-red-400 font-semibold' : 'text-slate-400'}`}>
                              {j.status.label} • QP: {j.qpTimeLocal}
                            </p>
                          </div>
                          <span className="text-xs font-mono text-slate-300">{j.status.localTime}</span>
                        </div>

                        <div className="flex flex-wrap gap-1.5 text-xs pt-1">
                          <a
                            href={j.broadcastUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className={`px-3 py-1.5 rounded-lg font-medium inline-flex items-center gap-1.5 transition ${
                              isLive
                                ? 'bg-red-600 hover:bg-red-500 text-white'
                                : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'
                            }`}
                          >
                            {isLive && <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse" />}
                            {j.code === 'FED'
                              ? isLive
                                ? 'House Live ↗'
                                : 'House Broadcast ↗'
                              : isLive
                              ? 'Legislature Live ↗'
                              : 'Legislature Broadcast ↗'}
                          </a>
                          {j.senateBroadcastUrl && (
                            <a
                              href={j.senateBroadcastUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className={`px-2.5 py-1.5 rounded-lg font-medium inline-flex items-center gap-1.5 transition ${
                                isLive
                                  ? 'bg-red-600/85 hover:bg-red-500 text-white'
                                  : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'
                              }`}
                            >
                              {isLive ? 'Senate Live ↗' : 'Senate Broadcast ↗'}
                            </a>
                          )}
                          <a href={j.calendarUrl} target="_blank" rel="noopener noreferrer" className="px-2.5 py-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-slate-300 border border-slate-800">
                            Schedule ↗
                          </a>
                          <a href={j.billsUrl} target="_blank" rel="noopener noreferrer" className="px-2.5 py-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-slate-300 border border-slate-800">
                            Bills ↗
                          </a>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </aside>
            </main>
          )}

          {/* TAB 2: POLITICAL ARENA */}
          {activeTab === 'map' && (
            <main className="max-w-7xl mx-auto px-4 py-4 space-y-6">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-base font-bold text-white">Find Your Riding, Party & Representatives</h2>
                    <p className="text-xs text-slate-400">
                      Enter any Canadian postal code to look up your Federal MP and Provincial MLA/MPP
                    </p>
                  </div>
                  <div className="flex flex-wrap items-center gap-3">
                    <form onSubmit={handlePostalLookup} className="flex items-center gap-2">
                      <input
                        type="text"
                        value={postalCode}
                        onChange={(e) => setPostalCode(e.target.value)}
                        placeholder="e.g., V9B 2W7"
                        maxLength={7}
                        className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white uppercase w-36"
                      />
                      <button
                        type="submit"
                        disabled={repLoading}
                        className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-xs font-semibold text-white"
                      >
                        {repLoading ? 'Searching...' : 'Lookup Riding'}
                      </button>
                    </form>
                    <label className="inline-flex items-center gap-2 text-xs text-slate-300 cursor-pointer select-none">
                      <input
                        type="checkbox"
                        checked={showMunicipal}
                        onChange={(e) => setShowMunicipal(e.target.checked)}
                        className="rounded bg-slate-950 border-slate-700 text-red-600 focus:ring-red-500"
                      />
                      <span>
                        Include Municipal{municipalCount > 0 ? ` (${municipalCount})` : ''}
                      </span>
                    </label>
                  </div>
                </div>

                {repError && <p className="text-xs text-red-400">{repError}</p>}

                {(visibleReps.length > 0 || lookupMeta) && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-2">
                    {visibleReps.map((rep, i) => (
                      <div
                        key={i}
                        className={`bg-slate-950 border rounded-lg p-3.5 space-y-1 ${
                          rep.isMunicipal ? 'border-slate-800/80' : 'border-slate-700'
                        }`}
                      >
                        <div className="flex items-center justify-between gap-2">
                          <span className="text-[10px] font-bold uppercase tracking-wider text-red-400">
                            {rep.elected_office} • {rep.district_name}
                          </span>
                        </div>
                        <div className="text-sm font-bold text-white">{rep.name}</div>
                        <div className="text-[11px] text-slate-400">{rep.level}</div>
                        <div className="text-xs text-slate-300">
                          Party: {rep.party_name || 'Independent / Non-Partisan'}
                        </div>
                        {rep.email && (
                          <div className="text-[11px] text-slate-400 truncate">{rep.email}</div>
                        )}
                      </div>
                    ))}

                    {lookupMeta && !lookupMeta.hasFederalMP && (
                      <div className="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3.5 flex flex-col justify-between gap-2">
                        <div>
                          <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400">
                            Federal MP • Official Verification
                          </span>
                          <p className="text-xs text-slate-200 mt-1">
                            Federal MP data for <strong>{lookupMeta.postalCode}</strong> is currently updating in the civic API.
                          </p>
                        </div>
                        <a
                          href="https://www.ourcommons.ca/members/en"
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-block text-center px-3 py-1.5 rounded bg-red-600 hover:bg-red-500 text-xs font-semibold text-white"
                        >
                          Find Your MP on ourcommons.ca ↗
                        </a>
                      </div>
                    )}

                    {lookupMeta && !lookupMeta.hasProvincialRep && lookupMeta.provCodes.map((pCode) => {
                      const jur = JURISDICTIONS.find((j) => j.code === pCode);
                      if (!jur) return null;
                      return (
                        <div
                          key={pCode}
                          className="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3.5 flex flex-col justify-between gap-2"
                        >
                          <div>
                            <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400">
                              {jur.shortName} {jur.repTitle} • Official Finder
                            </span>
                            <p className="text-xs text-slate-200 mt-1">
                              {jur.shortName} {jur.repTitle} data for <strong>{lookupMeta.postalCode}</strong> is still syncing after recent legislative updates.
                            </p>
                          </div>
                          <a
                            href={jur.finderUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-block text-center px-3 py-1.5 rounded bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white"
                          >
                            Find Your {jur.shortName} {jur.repTitle} Directly ↗
                          </a>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* INTERACTIVE MAP OF CANADA */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-base font-bold text-white">
                      Political Arena — Interactive Map of Canada
                    </h2>
                    <p className="text-xs text-slate-400">
                      Click any province or territory to filter seat standings & polling below, or toggle between Provincial Governments and Federal Riding Majorities
                    </p>
                  </div>
                  <div className="flex items-center gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-800 self-start">
                    <button
                      onClick={() => setMapMode('prov')}
                      className={`px-3 py-1.5 rounded-md text-xs font-semibold transition ${
                        mapMode === 'prov'
                          ? 'bg-red-600 text-white'
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      Provincial Governments
                    </button>
                    <button
                      onClick={() => setMapMode('fed')}
                      className={`px-3 py-1.5 rounded-md text-xs font-semibold transition ${
                        mapMode === 'fed'
                          ? 'bg-red-600 text-white'
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      Federal Riding Majority
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
                  <div className="lg:col-span-8 bg-slate-950 border border-slate-800 rounded-xl p-3">
                    <svg
                      viewBox="55 50 720 420"
                      className="w-full h-auto max-h-[370px] select-none"
                      role="img"
                      aria-label="Interactive Political Map of Canada"
                    >
                      {CANADA_MAP_SHAPES.map((shape) => {
                        const jur = JURISDICTIONS.find((j) => j.code === shape.code);
                        if (!jur) return null;
                        const fill = mapMode === 'prov' ? jur.provColor : jur.fedColor;
                        const isSelected = selectedJur === shape.code;
                        const isHovered = hoveredProv === shape.code;
                        return (
                          <g
                            key={shape.code}
                            onClick={() =>
                              setSelectedJur((prev) => (prev === shape.code ? 'ALL' : shape.code))
                            }
                            onMouseEnter={() => setHoveredProv(shape.code)}
                            onMouseLeave={() => setHoveredProv(null)}
                            className="cursor-pointer transition-opacity"
                          >
                            <path
                              d={shape.path}
                              fill={fill}
                              fillOpacity={isSelected || isHovered ? 1 : 0.78}
                              stroke={isSelected ? '#FFFFFF' : '#0F172A'}
                              strokeWidth={isSelected ? 3 : 2}
                              className="transition-all duration-150"
                            />
                            <text
                              x={shape.labelX}
                              y={shape.labelY}
                              textAnchor="middle"
                              dominantBaseline="middle"
                              fill="#FFFFFF"
                              fontSize={shape.code === 'PE' ? '10' : '12'}
                              fontWeight="700"
                              className="pointer-events-none"
                              style={{ textShadow: '0 1px 3px rgba(0,0,0,0.85)' }}
                            >
                              {shape.code}
                            </text>
                          </g>
                        );
                      })}
                    </svg>
                  </div>

                  <div className="lg:col-span-4 bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-red-400">
                        {hoveredProv ? 'Inspecting Region' : selectedJur !== 'ALL' ? 'Selected Region' : 'National Overview'}
                      </span>
                      {selectedJur !== 'ALL' && (
                        <button
                          onClick={() => setSelectedJur('ALL')}
                          className="text-[11px] text-blue-400 hover:text-blue-300 font-medium"
                        >
                          Reset to All Canada
                        </button>
                      )}
                    </div>

                    <div>
                      <h3 className="text-lg font-bold text-white">{inspectedJur.name}</h3>
                      <p className="text-xs text-slate-400">{inspectedJur.sessionLabel}</p>
                    </div>

                    <div className="space-y-2 text-xs pt-1">
                      <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                        <div className="text-[10px] uppercase text-slate-400 font-semibold">
                          {inspectedJur.code === 'FED' ? 'Federal Government' : 'Provincial / Territorial Government'}
                        </div>
                        <div className="text-sm font-bold text-white mt-0.5">{inspectedJur.governingParty}</div>
                        <div className="text-[11px] text-slate-400 mt-0.5">
                          {inspectedJur.totalSeats} Total Seats ({inspectedJur.majorityNeeded} for Majority)
                        </div>
                      </div>

                      <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                        <div className="text-[10px] uppercase text-slate-400 font-semibold">
                          Federal House of Commons Split
                        </div>
                        <div className="text-xs text-slate-200 font-medium mt-0.5">{inspectedJur.fedSummary}</div>
                      </div>
                    </div>

                    <div className="flex flex-wrap gap-2 pt-1">
                      <a
                        href={inspectedJur.mapUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex-1 text-center px-3 py-2 rounded-lg bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/30 text-xs font-semibold"
                      >
                        Official District Map ↗
                      </a>
                      <a
                        href={inspectedJur.standingsUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex-1 text-center px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold"
                      >
                        {inspectedJur.repTitle} Directory ↗
                      </a>
                    </div>
                  </div>
                </div>
              </div>

              {/* POLLING & PUBLIC OPINION HUB */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-2">
                  <div>
                    <h2 className="text-base font-bold text-white">
                      Polling & Public Opinion Trackers
                    </h2>
                    <p className="text-xs text-slate-400">
                      Live electoral projections, leader approval ratings, and major Canadian polling releases
                    </p>
                  </div>
                  <a
                    href="https://338canada.com/polls.htm"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-xs text-blue-400 hover:text-blue-300 font-medium shrink-0"
                  >
                    All Latest Federal Polls ↗
                  </a>
                </div>

                {/* FEATURED AGGREGATORS & APPROVAL TRACKERS */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <a
                    href={active338Url}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="p-4 rounded-xl bg-slate-950 hover:bg-slate-800/80 border border-red-500/30 hover:border-red-500/60 transition flex flex-col justify-between gap-2"
                  >
                    <div>
                      <span className="text-[10px] font-bold uppercase tracking-wider text-red-400">
                        Seat Projections & Averages
                      </span>
                      <div className="text-sm font-bold text-white mt-1">{active338Label} ↗</div>
                      <p className="text-[11px] text-slate-400 mt-1">
                        Statistical seat projections, popular vote averages, and riding-by-riding odds.
                      </p>
                    </div>
                  </a>

                  <a
                    href="https://angusreid.org/leader-approval-tracking-premiers/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="p-4 rounded-xl bg-slate-950 hover:bg-slate-800/80 border border-slate-800 hover:border-blue-500/40 transition flex flex-col justify-between gap-2"
                  >
                    <div>
                      <span className="text-[10px] font-bold uppercase tracking-wider text-blue-400">
                        Provincial Leadership
                      </span>
                      <div className="text-sm font-bold text-white mt-1">Angus Reid Premier Approval Tracker ↗</div>
                      <p className="text-[11px] text-slate-400 mt-1">
                        Quarterly performance ratings for Canada’s provincial premiers across the country.
                      </p>
                    </div>
                  </a>

                  <a
                    href="https://angusreid.org/carney-marker/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="p-4 rounded-xl bg-slate-950 hover:bg-slate-800/80 border border-slate-800 hover:border-blue-500/40 transition flex flex-col justify-between gap-2"
                  >
                    <div>
                      <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-400">
                        Federal Leadership
                      </span>
                      <div className="text-sm font-bold text-white mt-1">Prime Minister Approval Tracker ↗</div>
                      <p className="text-[11px] text-slate-400 mt-1">
                        Ongoing public approval tracking for the Prime Minister and historical benchmarks.
                      </p>
                    </div>
                  </a>
                </div>

                {/* MAJOR CANADIAN POLLSTERS */}
                <div className="space-y-2 pt-1">
                  <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                    Major Canadian Polling Firms
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                    {CANADIAN_POLLSTERS.map((pollster) => (
                      <a
                        key={pollster.name}
                        href={pollster.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="p-3 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 transition block"
                      >
                        <div className="text-xs font-bold text-slate-100">{pollster.name} ↗</div>
                        <p className="text-[11px] text-slate-400 mt-0.5">{pollster.desc}</p>
                      </a>
                    ))}
                  </div>
                </div>
              </div>

              {/* HOUSE OF COMMONS 343 SEATS */}
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 className="text-base font-bold text-white">
                      House of Commons — 343 Federal Seats by Region
                    </h2>
                    <p className="text-xs text-slate-400">
                      Each block represents 1 federal electoral district (LIB 173, CPC 137, BQ 21, NDP 5, GP 1, Vacant 6)
                    </p>
                  </div>
                  <div className="flex flex-wrap items-center gap-3 text-xs">
                    <span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-red-600" />Liberal (173)</span>
                    <span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-blue-600" />Conservative (137)</span>
                    <span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-sky-600" />Bloc (21)</span>
                    <span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-orange-600" />NDP (5)</span>
                    <span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-green-600" />Green (1)</span>
                    <span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-slate-500" />Vacant (6)</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {FEDERAL_REGIONAL_MAP.map((reg) => {
                    const tiles = [
                      ...Array(reg.LIB).fill('#DC2626'),
                      ...Array(reg.CPC).fill('#2563EB'),
                      ...Array(reg.BQ).fill('#0284C7'),
                      ...Array(reg.NDP).fill('#EA580C'),
                      ...Array(reg.GP).fill('#16A34A'),
                      ...Array(reg.VAC).fill('#64748B'),
                    ];
                    return (
                      <div key={reg.region} className="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                        <div className="flex items-center justify-between text-xs">
                          <span className="font-semibold text-white">{reg.region}</span>
                          <span className="text-slate-400">{reg.total} Ridings</span>
                        </div>
                        <div className="flex flex-wrap gap-1">
                          {tiles.map((hex, idx) => (
                            <span
                              key={idx}
                              style={{ backgroundColor: hex }}
                              className="w-3.5 h-3.5 rounded-[3px] inline-block"
                              title={`${reg.region} Riding #${idx + 1}`}
                            />
                          ))}
                        </div>
                        <div className="text-[11px] text-slate-400 flex flex-wrap gap-2 pt-1">
                          {reg.LIB > 0 && <span>LIB: {reg.LIB}</span>}
                          {reg.CPC > 0 && <span>CPC: {reg.CPC}</span>}
                          {reg.BQ > 0 && <span>BQ: {reg.BQ}</span>}
                          {reg.NDP > 0 && <span>NDP: {reg.NDP}</span>}
                          {reg.GP > 0 && <span>GP: {reg.GP}</span>}
                          {reg.VAC > 0 && <span className="text-amber-400">Vacant: {reg.VAC}</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="space-y-3">
                <h2 className="text-base font-bold text-white">
                  All 14 Chambers — Current Seat Standings & District Maps (Nov 2026)
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {filteredPortals.map((j) => (
                    <div key={j.code} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                      <div className="flex items-start justify-between gap-2">
                        <div>
                          <h3 className="text-sm font-bold text-white">{j.name}</h3>
                          <p className="text-xs text-slate-400">
                            {j.governingParty} • {j.totalSeats} Total Seats ({j.majorityNeeded} for Majority)
                          </p>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <a
                            href={j.mapUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-2 py-1 rounded bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/30 text-[11px] font-medium"
                          >
                            District Map ↗
                          </a>
                          <a
                            href={j.standingsUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="text-xs text-red-400 hover:text-red-300 font-medium"
                          >
                            {j.repTitle} List ↗
                          </a>
                        </div>
                      </div>

                      <div className="h-3 w-full rounded-full overflow-hidden flex bg-slate-800">
                        {j.standings.map((s) => (
                          <div
                            key={s.party}
                            style={{
                              width: `${(s.seats / j.totalSeats) * 100}%`,
                              backgroundColor: s.color,
                            }}
                            title={`${s.party}: ${s.seats} seats`}
                          />
                        ))}
                      </div>

                      <div className="flex flex-wrap gap-x-4 gap-y-1.5 text-xs">
                        {j.standings.map((s) => (
                          <div key={s.party} className="flex items-center gap-1.5">
                            <span
                              style={{ backgroundColor: s.color }}
                              className="w-2.5 h-2.5 rounded-full inline-block"
                            />
                            <span className="text-slate-300">{s.party}:</span>
                            <span className="font-bold text-white">{s.seats}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* TAB 3: ELECTIONS & BY-ELECTIONS CALENDAR */}
          {activeTab === 'elections' && (
            <main className="max-w-7xl mx-auto px-4 py-4 space-y-6">
              <div className="space-y-3">
                <h2 className="text-base font-bold text-white">
                  Active By-Elections & Vacant Seats Across Canada
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {ACTIVE_BYELECTIONS.map((by) => (
                    <div
                      key={by.id}
                      className="bg-slate-900 border border-amber-500/40 rounded-xl p-5 space-y-3"
                    >
                      <div className="flex items-center justify-between gap-2">
                        <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                          {by.status}
                        </span>
                        <span className="text-xs font-semibold text-emerald-400">
                          {daysUntil(by.date, now)}
                        </span>
                      </div>
                      <div>
                        <h3 className="text-base font-bold text-white">
                          {by.jurisdiction} — {by.type}
                        </h3>
                        <p className="text-xs text-slate-300 mt-0.5">Election Date: {by.dateLabel}</p>
                      </div>
                      <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 space-y-1">
                        <div className="text-[11px] font-semibold text-slate-400 uppercase">
                          Ridings Contested / Vacant:
                        </div>
                        <ul className="text-xs text-slate-200 space-y-1 list-disc list-inside">
                          {by.ridings.map((r) => (
                            <li key={r}>{r}</li>
                          ))}
                        </ul>
                      </div>
                      <div className="pt-1">
                        <a
                          href={by.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-xs font-semibold text-white"
                        >
                          Official Elections Agency & Voter Info ↗
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div>
                  <h2 className="text-base font-bold text-white">
                    Fixed-Date General Election Schedule (2027 – 2030)
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">
                    Statutory scheduled election dates across Federal, Provincial, and Territorial jurisdictions
                  </p>
                </div>

                <div className="divide-y divide-slate-800">
                  {GENERAL_ELECTION_CALENDAR.map((el) => (
                    <div
                      key={el.jurisdiction}
                      className="py-3 flex flex-wrap items-center justify-between gap-2 text-xs"
                    >
                      <div>
                        <span className="font-bold text-white text-sm">{el.jurisdiction}</span>
                        <span className="text-slate-400 block sm:inline sm:ml-3">
                          Scheduled: <strong className="text-slate-200">{el.dateLabel}</strong>
                        </span>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="px-2.5 py-1 rounded bg-slate-950 border border-slate-800 text-slate-300 font-mono">
                          {daysUntil(el.date, now)}
                        </span>
                        <a
                          href={el.agencyUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="text-blue-400 hover:text-blue-300 font-medium"
                        >
                          Elections Portal ↗
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* BILL DETAIL MODAL */}
          {activeBill && (
            <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4" onClick={() => setActiveBill(null)}>
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-3" onClick={(e) => e.stopPropagation()}>
                <p className="text-xs font-bold text-red-400">{activeBill.jurisdictionName} • {activeBill.number}</p>
                <h3 className="text-lg font-bold text-white">{activeBill.title}</h3>
                <p className="text-xs text-slate-400">Sponsor: {activeBill.sponsor}</p>
                <p className="text-sm text-slate-200 bg-slate-950 p-3 rounded-xl border border-slate-800">{activeBill.background}</p>
                <p className="text-xs text-slate-300">Latest status: {activeBill.latestActivity} ({activeBill.stageLabel})</p>
                <div className="flex flex-wrap justify-end gap-2 pt-2">
                  <button onClick={() => setActiveBill(null)} className="px-3.5 py-2 rounded-lg bg-slate-800 text-xs">Close</button>
                  <a
                    href={buildGoogleNewsSearchUrl(`"${activeBill.number}" "${activeBill.title}" Canada`)}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-3.5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white"
                  >
                    Find Related News ↗
                  </a>
                  <a href={activeBill.officialUrl} target="_blank" rel="noopener noreferrer" className="px-3.5 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-xs font-semibold text-white">
                    Official Bill Page ↗
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
